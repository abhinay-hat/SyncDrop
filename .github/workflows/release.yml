name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }}${{ matrix.target && format(' {0}', matrix.target) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: ""
            args: ""
          - os: windows-latest
            target: ""
            args: ""
    steps:
      - name: Validate release tag
        id: tag
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          # workflow_dispatch must not checkout arbitrary refs; tags only.
          if [[ ! "$RAW" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Refusing non-version tag: $RAW" >&2
            exit 1
          fi
          echo "name=$RAW" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Do not write Apple secrets to GITHUB_ENV (they would persist for later
      # steps). Detect whether a cert is present, then pass secrets only as
      # step env on the signed tauri-action invocation.
      - name: Detect Apple signing secrets
        id: apple
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@action-v0.6.2
        if: runner.os != 'macOS' || steps.apple.outputs.signed != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: SyncDrop v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            macOS unsigned: right-click > Open, or `xattr -dr com.apple.quarantine` on the app.
            Windows SmartScreen: More info > Run anyway.
            Linux AppImage: `chmod +x` before launching.

      - uses: tauri-apps/tauri-action@action-v0.6.2
        if: runner.os == 'macOS' && steps.apple.outputs.signed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
          tagName: ${{ steps.tag.outputs.name }}
          releaseName: SyncDrop v__VERSION__
          releaseDraft: false
          prerelease: false
          releaseBody: |
            macOS unsigned: right-click > Open, or `xattr -dr com.apple.quarantine` on the app.
            Windows SmartScreen: More info > Run anyway.
            Linux AppImage: `chmod +x` before launching.

  android:
    name: android
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        id: tag
        run: |
          set -euo pipefail
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$RAW" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Refusing non-version tag: $RAW" >&2
            exit 1
          fi
          echo "name=$RAW" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VER="${TAG#v}"
          APK="SyncDrop-android-v${VER}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$TAG" "$APK" --clobber
