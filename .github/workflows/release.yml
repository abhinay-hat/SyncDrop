name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  desktop:
    name: desktop (${{ matrix.os }}${{ matrix.target && format(' {0}', matrix.target) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04
            target: ""
            args: ""
          - os: windows-latest
            target: ""
            args: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # Blank secrets stay unset. An empty APPLE_CERTIFICATE is still "set"
      # and Tauri tries to import it, which fails the unsigned build.
      - name: Apple signing env
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          add_secret() {
            if [ -n "$2" ]; then
              {
                echo "${1}<<SYNCDROP_ENV"
                echo "$2"
                echo "SYNCDROP_ENV"
              } >> "$GITHUB_ENV"
            fi
          }
          add_secret APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
          add_secret APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
          add_secret APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
          add_secret APPLE_ID "$APPLE_ID"
          add_secret APPLE_PASSWORD "$APPLE_PASSWORD"
          add_secret APPLE_TEAM_ID "$APPLE_TEAM_ID"

      - uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop/app
          args: ${{ matrix.args }}
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: SyncDrop v__VERSION__
          releaseDraft: false
          prerelease: ${{ startsWith(github.event.inputs.tag || github.ref_name, 'v0.') }}
          releaseBody: |
            macOS unsigned: right-click > Open, or `xattr -dr com.apple.quarantine` on the app.
            Windows SmartScreen: More info > Run anyway.
            Linux AppImage: `chmod +x` before launching.

  android:
    name: android
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${TAG#v}"
          APK="SyncDrop-android-v${VER}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release upload "$TAG" "$APK" --clobber
