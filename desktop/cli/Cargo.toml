[package]
name = "syncdrop-cli"
version = "0.1.0"
edition = "2021"
description = "SyncDrop command-line planner, sync, and cleanup"
publish = false

[[bin]]
name = "syncdrop-cli"
path = "src/main.rs"

[dependencies]
syncdrop-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
